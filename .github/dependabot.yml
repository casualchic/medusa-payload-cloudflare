# Dependabot keeps the SHA-pinned GitHub Actions in .github/workflows/*.yml
# up to date (the org actions policy requires full-length commit SHA pins,
# so updates only arrive via PRs that bump the pinned SHA).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
